<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sàn TMĐT Olist - Mô Phỏng Giao Dịch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">🛒 TẠO GIAO DỊCH OLIST MỚI</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="/submit" method="POST">
                            
                            <h5 class="text-primary border-bottom pb-2">1. Thông tin Đơn hàng</h5>
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Khách hàng (Tài khoản mẫu)</label>
                                    <select class="form-select" name="customer_id">
                                        <option value="9ef432eb6251297304e76186b10a928d">Khách VIP A (Hà Nội)</option>
                                        <option value="b0830fb4747a6c6d20dea0b8c802d7ef">Khách Thường B (HCM)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Sản phẩm</label>
                                    <select class="form-select" name="product_id">
                                        <option value="a9516a079e37a9c9c36b9b78b10169e8">Bàn phím cơ (Mã SP: a951...)</option>
                                        <option value="4aa6014eceb682077f9dc4bffebc05b0">Chuột không dây (Mã SP: 4aa6...)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Giá sản phẩm ($)</label>
                                    <input type="number" step="0.01" class="form-control" name="price" required value="150.00">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Phí vận chuyển ($)</label>
                                    <input type="number" step="0.01" class="form-control" name="freight_value" required value="15.50">
                                </div>
                            </div>

                            <h5 class="text-success border-bottom pb-2">2. Hình thức Thanh toán</h5>
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Phương thức</label>
                                    <select class="form-select" name="payment_type">
                                        <option value="credit_card">Thẻ Tín dụng (Credit Card)</option>
                                        <option value="boleto">Chuyển khoản (Boleto)</option>
                                        <option value="voucher">Dùng Mã giảm giá (Voucher)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Số tháng trả góp</label>
                                    <input type="number" class="form-control" name="payment_installments" value="1" min="1" max="12">
                                </div>
                            </div>

                            <h5 class="text-warning border-bottom pb-2">3. Đánh giá của Khách (Mô phỏng)</h5>
                            <div class="row mb-4">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Điểm sao (1-5)</label>
                                    <input type="number" class="form-control" name="review_score" value="5" min="1" max="5" required>
                                </div>
                                <div class="col-md-8 mb-3">
                                    <label class="form-label fw-bold">Bình luận</label>
                                    <input type="text" class="form-control" name="review_comment" placeholder="Ví dụ: Hàng đóng gói cẩn thận!">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">🚀 XÁC NHẬN ĐẶT HÀNG & BẮN DỮ LIỆU</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
