services:

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  init-kafka:
    image: apache/kafka:latest
    depends_on:
      - kafka
    command: >
      bash -c "
      echo '⏳ Wait for Kafka to start (5 seconds)...';
      sleep 5;
      echo '🛠️ Start creating 4 Kafka topics...';
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_orders --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_items --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_payments --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_reviews --bootstrap-server kafka:9092;
      echo '✅ Successfully created 4 Topics!';
      "
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    shm_size: '256mb'
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=olist
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=olist_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false # <-- Prevent Docker IP lookup mismatch issues
    ports:
      - "9870:9870"
      - "8020:8020"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020

  webapp:
    build: ./webapp
    ports:
      - "5000:5000"
    depends_on:
      - kafka
    volumes:
      - ./webapp:/app


  spark_streaming:
    build: ./spark
    depends_on:
      - kafka
      - namenode
    volumes:
      - ./spark:/app
      - ../../Data:/Data
    command: >
      bash -c "
      echo '⏳ Waiting for NameNode port 8020...';
      while ! nc -z namenode 8020; do   
        sleep 2;
      done;
      echo '✅ NameNode is ready! Starting Spark Streaming...';
      spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.6.0 streaming_ingestion.py"

  spark_batch:
    build: ./spark
    depends_on:
      - spark_streaming
      - postgres
      - namenode
    volumes:
      - ./spark:/app
      - ../../Data:/Data
    command: >
      bash -c "
      echo '⏳ Waiting for NameNode port 8020...';
      while ! nc -z namenode 8020; do   
        sleep 2;
      done;
      echo '✅ NameNode is ready! Starting HDFS to Postgres Streaming...';
      spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.6.0 /app/load_to_postgres.py"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning

  producer:
    build: 
      context: ./kafka
      dockerfile: Dockerfile
    container_name: olist_producer
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../Data:/Data

  dbt:
    build: ./dbt_project
    container_name: olist_dbt
    depends_on:
      - postgres
    environment:
      - DBT_PROFILES_DIR=.
    volumes:
      - ./dbt_project:/usr/app
    command: >
      bash -c "
      echo '⏳ Waiting for postgres...';
      while ! python -c \"import socket; s = socket.socket(); s.connect(('postgres', 5432))\" 2>/dev/null; do
        sleep 2;
      done;
      echo '⏳ Waiting for Spark Batch to load raw tables into Postgres...';
      python -c \"
      import psycopg2, time
      while True:
          try:
              conn = psycopg2.connect(host='postgres', database='olist', user='postgres', password='postgres')
              cur = conn.cursor()
              cur.execute(\\\"SELECT 1 FROM information_schema.tables WHERE table_schema = 'raw' AND table_name = 'customers';\\\")
              res = cur.fetchone()
              cur.close()
              conn.close()
              if res:
                  break
          except Exception:
              pass
          time.sleep(3)
      \";
      echo '✅ Raw tables are loaded! Running initial DBT models...';
      dbt run;
      echo '🔄 Starting periodic DBT run loop for streaming models...';
      while true; do
        sleep 10;
        dbt run --select stg_orders+ stg_order_items+ stg_order_payments+ stg_order_reviews+;
      done"

volumes:
  postgres_data:
  grafana_data: