services:
# 1. CỤM HẠ TẦNG KAFKA (HÀNG CHÍNH CHỦ APACHE - KRAFT MODE)
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

# 1.5 CỤM DỌN ĐƯỜNG (INIT CONTAINER) - Tự động tạo Topic rồi tự tắt
  init-kafka:
    image: apache/kafka:latest
    depends_on:
      - kafka
    command: >
      bash -c "
      echo '⏳ Đợi Kafka khởi động 5 giây...';
      sleep 5;
      echo '🛠 Bắt đầu xây 4 đường ống Topic...';
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_orders --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_items --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_payments --bootstrap-server kafka:9092;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic live_reviews --bootstrap-server kafka:9092;
      echo '✅ Đã xây xong 4 Topic! Kẻ dọn đường xin phép rút lui!';
      "

# 2. CỤM HẠ TẦNG LƯU TRỮ HDFS
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=olist_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020  # <-- THÊM DÒNG NÀY
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false # <-- THÊM DÒNG NÀY ĐỂ CHỐNG LỖI IP DOCKER
    ports:
      - "9870:9870"
      - "8020:8020" # Đổi 9000 thành 8020 cho chuẩn

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020

  # 3. CỤM WEB APP
  webapp:
    build: ./docker_webapp
    ports:
      - "5000:5000"
    depends_on:
      - kafka

# 4. CỤM SPARK STREAMING
  spark_streaming:
    build: ./docker_spark_streaming
    depends_on:
      - kafka
      - namenode
    # Dùng vòng lặp bash để gõ cửa liên tục cổng 9000. Cửa mở mới chạy Spark.
    command: >
      bash -c "
      echo '⏳ Đang chờ NameNode mở cổng 8020...';
      while ! nc -z namenode 8020; do   
        sleep 2;
      done;
      echo '✅ NameNode đã sẵn sàng! Bắt đầu chạy Spark...';
      spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 streaming_ingestion.py"